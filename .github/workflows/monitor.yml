name: Social Media AI Monitor

on:
  schedule:
    # يعمل تلقائياً كل ساعتين
    - cron: '0 */2 * * *'
  workflow_dispatch: # يتيح لك زر تشغيل يدوي في أي وقت للتجربة

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: نسخ كود المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: تشغيل سكربت الرصد
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: حفظ الروابط المرصودة لمنع التكرار
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_urls.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "تحديث المنشورات السابقة [skip ci]" && git push)
